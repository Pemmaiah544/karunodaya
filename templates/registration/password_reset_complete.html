{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Karunodaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center">
                <div class="flex justify-center">
                    <img src="{% static 'images/foundation-logo.png' %}" alt="Karunodaya Logo"
                        class="h-16 sm:h-20 w-auto -ml-10 content-center mb-8">
                </div>
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                    <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>

                <h3 class="text-2xl font-semibold mb-2">Password Reset Complete</h3>
                <p class="text-sm text-gray-600 mb-6">
                    Your password has been successfully reset. You can now sign in with your new password.
                </p>

                <a href="{% url 'portal:login' %}"
                    class="block w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200">
                    Sign In
                </a>
            </div>
        </div>
    </div>
</body>

</html>

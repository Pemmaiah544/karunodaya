<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Karunodaya - Book Platform{% endblock %}</title>

    <!-- Tailwind CSS CDN (for development) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="{% static 'js/htmx.min.js' %}" defer></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    {% block body %}
    <div id="main-wrapper">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <!-- Notification Toast System -->
    {% include 'partials/notification_toast.html' %}

    <!-- Notification Polling (Real-time notifications) -->
    {% if user.is_authenticated %}
    <script>
        // Poll for new notifications every 10 seconds
        let lastNotificationCount = 0;

        function checkForNewNotifications() {
            fetch('/api/reading-reminders/')
                .then(r => r.json())
                .then(data => {
                    const newCount = data.total || 0;
                    if (newCount > lastNotificationCount) {
                        // New notifications arrived!
                        const notificationType = data.messages && data.messages[0] ? data.messages[0] : 'New reading reminder';
                        window.NotificationToast.info(`📚 ${notificationType}`, 6000);

                        // Update badge
                        const badge = document.querySelector('[data-notification-badge]');
                        if (badge) {
                            badge.textContent = newCount;
                            badge.style.display = newCount > 0 ? 'block' : 'none';
                        }
                    }
                    lastNotificationCount = newCount;
                })
                .catch(err => console.log('Notification poll error:', err));
        }

        // Check immediately on page load
        checkForNewNotifications();

        // Then check every 30 seconds
        setInterval(checkForNewNotifications, 30000);
    </script>
    {% endif %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>

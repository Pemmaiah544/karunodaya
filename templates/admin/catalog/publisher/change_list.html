{% extends "admin/catalog/enhanced_book_clean.html" %}
{% load i18n %}

{% block object-tools-items %}
<li>
    <a href="{% url 'admin:catalog_publisher_add_custom' %}" style="
            background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
            color: #fff; padding: 8px 18px; border: none; border-radius: 7px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(251,146,60,0.4); transition: all 0.2s;
            letter-spacing: 0.01em; text-decoration: none; display: inline-block;
        " onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 4px 12px rgba(251,146,60,0.45)'"
        onmouseout="this.style.transform='';this.style.boxShadow='0 2px 6px rgba(251,146,60,0.4)'">+ Add Publisher</a>
</li>
{% endblock %}

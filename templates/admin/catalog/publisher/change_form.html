{% extends "admin/change_form.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    .back-to-list-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
        color: white !important;
        border: none;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 4px rgba(251, 146, 60, 0.3);
        margin-bottom: 15px;
    }

    .back-to-list-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(251, 146, 60, 0.4);
        color: white !important;
        text-decoration: none;
    }

    .back-to-list-btn svg {
        transition: transform 0.2s ease;
    }

    .back-to-list-btn:hover svg {
        transform: translateX(-2px);
    }

    /* Style the History button in orange */
    .historylink,
    a[href*="/history/"] {
        background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%) !important;
        color: white !important;
        border: none !important;
        padding: 8px 16px !important;
        border-radius: 6px !important;
        font-weight: 600 !important;
        transition: all 0.2s ease !important;
        box-shadow: 0 2px 4px rgba(251, 146, 60, 0.3) !important;
    }

    .historylink:hover,
    a[href*="/history/"]:hover {
        transform: translateY(-1px) !important;
        box-shadow: 0 4px 8px rgba(251, 146, 60, 0.4) !important;
        color: white !important;
    }

    /* Add border radius to form modules and remove dividing lines */
    .module {
        border-radius: 12px !important;
        overflow: hidden !important;
        border: none !important;
    }

    fieldset.module {
        border-radius: 12px !important;
        border: 1px solid #e5e7eb !important;
    }

    /* Remove unwanted dividing lines */
    .module h2,
    .module caption,
    .inline-group h2 {
        border-bottom: none !important;
        border-radius: 12px 12px 0 0 !important;
    }

    /* Add border radius to form rows */
    .form-row {
        border-bottom: none !important;
    }

    /* Style the submit row with border radius */
    .submit-row {
        border-radius: 0 0 12px 12px !important;
        border-top: 1px solid #e5e7eb !important;
    }

    /* Remove sharp edges from breadcrumbs */
    .breadcrumbs {
        border-radius: 8px !important;
    }
</style>
{% endblock %}

{% block content %}
<div style="padding: 20px;">
    <a href="{% url 'admin:catalog_publisher_changelist' %}" class="back-to-list-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        <span>Back to Publishers</span>
    </a>
</div>
{{ block.super }}
{% endblock %}

{% extends "admin/object_history.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    .back-to-publisher-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
        color: white !important;
        border: none;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 4px rgba(251, 146, 60, 0.3);
        margin-bottom: 20px;
    }

    .back-to-publisher-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(251, 146, 60, 0.4);
        color: white !important;
        text-decoration: none;
    }

    .back-to-publisher-btn svg {
        transition: transform 0.2s ease;
    }

    .back-to-publisher-btn:hover svg {
        transform: translateX(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div style="padding: 20px 0;">
    <a href="javascript:history.back()" class="back-to-publisher-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        <span>Back to Publisher</span>
    </a>
</div>
{{ block.super }}
{% endblock %}

{% for book in books %}
<div class="bg-white rounded-lg shadow overflow-hidden">
    {% if book.cover_image %}
    <img src="{{ book.cover_image.url }}" alt="{{ book.title }}" class="w-full h-48 object-cover">
    {% else %}
    <div class="w-full h-48 bg-gray-200 flex items-center justify-center">
        <span class="text-4xl">📚</span>
    </div>
    {% endif %}
    <div class="p-4">
        <h3 class="font-semibold text-sm mb-1">{{ book.title|truncatechars:30 }}</h3>
        <p class="text-xs text-gray-600 mb-2">{{ book.author }}</p>
        <p class="text-lg font-bold text-primary-600">₹{{ book.mrp }}</p>
        <a href="{% url 'portal:book_detail' book.id %}"
           class="block mt-2 text-center bg-primary-600 hover:bg-primary-700 text-white text-sm py-2 rounded">
            View Details
        </a>
    </div>
</div>
{% empty %}
<p class="col-span-full text-center text-gray-500 py-8">No books found.</p>
{% endfor %}

{% extends "portal/base.html" %}
{% load static %}

{% block title %}Onboarding - Karunodaya{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Welcome to Karunodaya!</h1>

        <!-- Progress Steps -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex-1 border-t-2 border-primary-600"></div>
                <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium">1</span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
                <span class="px-4 py-2 bg-gray-300 text-gray-600 rounded-full text-sm font-medium">2</span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
                <span class="px-4 py-2 bg-gray-300 text-gray-600 rounded-full text-sm font-medium">3</span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
            </div>
        </div>

        <!-- Onboarding Steps (HTMX will swap content here) -->
        <div id="onboarding-content" class="bg-white rounded-lg shadow-md p-6">
            <!-- Step 1: Parent Info -->
            <h2 class="text-2xl font-semibold mb-6">Tell us about yourself</h2>

            <form hx-post="{% url 'portal:onboarding_step2' %}"
                  hx-target="#onboarding-content"
                  hx-swap="innerHTML"
                  class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" name="phone_number" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <textarea name="address" rows="3" required
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                        <input type="text" name="city" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
                        <input type="text" name="state" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pincode</label>
                    <input type="text" name="pincode" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                </div>

                <button type="submit"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-4 rounded-lg">
                    Next Step →
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

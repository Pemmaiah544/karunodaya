{% extends "portal/base.html" %}
{% load static %}

{% block title %}Onboarding - Karunodaya{% endblock %}

{% block content %}
<script>
    // Save form data to local storage
    function saveFormData() {
        const formData = new FormData(document.querySelector('form'));
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });
        localStorage.setItem('onboarding_step1_data', JSON.stringify(data));
    }

    // Load form data from local storage
    function loadFormData() {
        const savedData = localStorage.getItem('onboarding_step1_data');
        if (savedData) {
            const data = JSON.parse(savedData);

            // Restore form fields
            Object.keys(data).forEach(key => {
                const input = document.querySelector(`[name="${key}"]`);
                if (input) {
                    input.value = data[key];
                }
            });
        }
    }

    // Clear onboarding data
    function clearOnboardingData() {
        localStorage.removeItem('onboarding_step1_data');
        localStorage.removeItem('onboarding_step2_data');
        localStorage.removeItem('onboarding_step3_data');
        localStorage.removeItem('onboarding_plan_type');
    }

    // Auto-save form data
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', saveFormData);
    });

    // Load saved data on page load
    document.addEventListener('DOMContentLoaded', loadFormData);
</script>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-8 text-center">Welcome to Karunodaya!</h1>

        <!-- Progress Steps -->
        <div id="progress-bar" class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex-1 border-t-2 border-gray-300"></div>
                <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium">
                    1
                </span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
                <span class="px-4 py-2 bg-gray-300 text-gray-600 rounded-full text-sm font-medium">2</span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
            </div>
            <div class="flex justify-between mt-2 text-sm text-gray-600 px-2">
                <span class="font-medium text-primary-600">Parent Info</span>
                <span>Child Info</span>
            </div>
        </div>

        <!-- Onboarding Steps (HTMX will swap content here) -->
        <div id="onboarding-content" class="bg-white rounded-lg shadow-md p-6">
            <!-- Step 1: Parent Info -->
            <h2 class="text-2xl font-semibold mb-6">Tell us about yourself</h2>

            <form hx-post="{% url 'portal:onboarding_step2' %}" hx-target="#onboarding-content" hx-swap="innerHTML"
                class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span
                                class="text-red-500">*</span></label>
                        <input type="text" name="first_name" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name <span
                                class="text-gray-400 text-xs">(Optional)</span></label>
                        <input type="text" name="last_name"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" name="phone_number" value="{{ request.user.username }}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 outline-none" readonly>
                    <p class="text-xs text-gray-500 mt-1">Mobile number used for signup</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address <span
                            class="text-gray-400 text-xs">(Optional)</span></label>
                    <textarea name="address" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City <span
                                class="text-gray-400 text-xs">(Optional)</span></label>
                        <input type="text" name="city"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">State <span
                                class="text-gray-400 text-xs">(Optional)</span></label>
                        <input type="text" name="state"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pincode <span
                            class="text-gray-400 text-xs">(Optional)</span></label>
                    <input type="text" name="pincode"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                </div>

                <div class="flex justify-between mt-6">
                    <button type="button" disabled
                        class="px-4 py-2 text-sm border border-gray-300 text-gray-400 rounded-lg cursor-not-allowed flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        Back
                    </button>
                    <button type="submit"
                        class="px-4 py-2 text-sm bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg flex items-center">
                        Next
                        <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

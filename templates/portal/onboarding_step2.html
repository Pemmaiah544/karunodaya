<!-- Save form data to local storage -->
<script>
    function saveFormData() {
        const formData = new FormData(document.querySelector('form'));
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });
        localStorage.setItem('onboarding_step2_data', JSON.stringify(data));
    }

    // Load form data from local storage
    function loadFormData() {
        const savedData = localStorage.getItem('onboarding_step2_data');
        if (savedData) {
            const data = JSON.parse(savedData);

            // Restore form fields
            Object.keys(data).forEach(key => {
                const input = document.querySelector(`[name="${key}"]`);
                if (input) {
                    input.value = data[key];
                }
            });
        }
    }

    // Auto-save form data
    document.querySelectorAll('input, select').forEach(input => {
        input.addEventListener('input', saveFormData);
        input.addEventListener('change', saveFormData);
    });

    // Load saved data on page load
    document.addEventListener('DOMContentLoaded', loadFormData);

    // Update progress bar for step 2
    document.getElementById('progress-bar').innerHTML = `
    <div class="flex items-center justify-between">
        <div class="flex-1 border-t-2 border-primary-600"></div>
        <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
            1
        </span>
        <div class="flex-1 border-t-2 border-primary-600"></div>
        <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium">
            2
        </span>
        <div class="flex-1 border-t-2 border-gray-300"></div>
    </div>
    <div class="flex justify-between mt-2 text-sm text-gray-600 px-2">
        <span class="font-medium text-primary-600">Parent Info</span>
        <span class="font-medium text-primary-600">Child Info</span>
    </div>
`;
</script>

<h2 class="text-2xl font-semibold mb-6">Add your child <span
        class="text-gray-400 text-base font-normal">(Optional)</span></h2>

<form method="post" action="{% url 'portal:onboarding_step3' %}" class="space-y-4">
    {% csrf_token %}


    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Child's Name <span
                class="text-gray-400 text-xs">(Optional)</span></label>
        <input type="text" name="name"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth <span
                class="text-gray-400 text-xs">(Optional)</span></label>
        <input type="date" name="date_of_birth" id="date_of_birth"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
        <p class="text-xs text-gray-500 mt-1" id="age_display"></p>
    </div>

    <!-- Hidden age field for form submission -->
    <input type="hidden" name="age" id="age_hidden">

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Grade <span
                class="text-gray-400 text-xs">(Optional)</span></label>
        <select name="grade"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
            <option value="">Select Grade</option>
            <option value="PRE_K">Pre-K</option>
            <option value="KINDERGARTEN">Kindergarten</option>
            <option value="GRADE_1">Grade 1</option>
            <option value="GRADE_2">Grade 2</option>
            <option value="GRADE_3">Grade 3</option>
            <option value="GRADE_4">Grade 4</option>
            <option value="GRADE_5">Grade 5</option>
            <option value="GRADE_6">Grade 6</option>
            <option value="GRADE_7">Grade 7</option>
            <option value="GRADE_8">Grade 8</option>
        </select>
    </div>

    <script>
        // Calculate age from date of birth
        document.getElementById('date_of_birth').addEventListener('change', function () {
            const dob = new Date(this.value);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const monthDiff = today.getMonth() - dob.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
                age--;
            }

            // Update hidden age field
            document.getElementById('age_hidden').value = age;

            // Display age
            if (age >= 3 && age <= 14) {
                document.getElementById('age_display').textContent = `Age: ${age} years`;
                document.getElementById('age_display').classList.remove('text-red-500');
                document.getElementById('age_display').classList.add('text-gray-500');
            } else {
                document.getElementById('age_display').textContent = `Age must be between 3 and 14 years`;
                document.getElementById('age_display').classList.remove('text-gray-500');
                document.getElementById('age_display').classList.add('text-red-500');
            }
        });
    </script>

    <div class="flex justify-between mt-6">
        <a href="{% url 'portal:onboarding' %}"
            class="px-4 py-2 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 flex items-center">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <button type="submit"
            class="px-4 py-2 text-sm bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg flex items-center">
            Complete Setup
            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </button>
    </div>
</form>

<!-- Update progress bar for step 3 -->
<script>
document.getElementById('progress-bar').innerHTML = `
    <div class="flex items-center justify-between">
        <div class="flex-1 border-t-2 border-primary-600"></div>
        <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
            1
        </span>
        <div class="flex-1 border-t-2 border-primary-600"></div>
        <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
            2
        </span>
        <div class="flex-1 border-t-2 border-primary-600"></div>
        <span class="px-4 py-2 bg-primary-600 text-white rounded-full text-sm font-medium flex items-center">
            3
        </span>
        <div class="flex-1 border-t-2 border-gray-300"></div>
    </div>
    <div class="flex justify-between mt-2 text-xs text-gray-600">
        <span class="font-medium text-primary-600">Parent Info</span>
        <span class="font-medium text-primary-600">Child Info</span>
        <span class="font-medium text-primary-600">Choose Plan</span>
    </div>
`;

// Handle plan type selection
document.querySelectorAll('input[name="plan_type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        const subscriptionPlans = document.getElementById('subscription-plans');
        const submitButton = document.querySelector('button[type="submit"]');
        const submitButtonText = submitButton.querySelector('span') || submitButton;
        
        if (this.value === 'subscription' || this.value === 'both') {
            subscriptionPlans.classList.remove('hidden');
            submitButton.childNodes[0].textContent = 'Complete Setup';
        } else {
            subscriptionPlans.classList.add('hidden');
            submitButton.childNodes[0].textContent = 'Complete Setup';
        }
        
        // Save to local storage
        localStorage.setItem('onboarding_plan_type', this.value);
    });
});

// Save form data to local storage
function saveFormData() {
    const formData = new FormData(document.querySelector('form'));
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });
    localStorage.setItem('onboarding_step3_data', JSON.stringify(data));
}

// Load form data from local storage
function loadFormData() {
    const savedData = localStorage.getItem('onboarding_step3_data');
    if (savedData) {
        const data = JSON.parse(savedData);
        
        // Restore plan type
        if (data.plan_type) {
            const planTypeRadio = document.querySelector(`input[name="plan_type"][value="${data.plan_type}"]`);
            if (planTypeRadio) {
                planTypeRadio.checked = true;
                planTypeRadio.dispatchEvent(new Event('change'));
            }
        }
        
        // Restore plan selection
        if (data.plan_id) {
            const planRadio = document.querySelector(`input[name="plan_id"][value="${data.plan_id}"]`);
            if (planRadio) {
                planRadio.checked = true;
            }
        }
    }
}

// Clear onboarding data
function clearOnboardingData() {
    localStorage.removeItem('onboarding_step1_data');
    localStorage.removeItem('onboarding_step2_data');
    localStorage.removeItem('onboarding_step3_data');
    localStorage.removeItem('onboarding_plan_type');
}

// Auto-save form data
document.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener('change', saveFormData);
});

// Load saved data on page load
document.addEventListener('DOMContentLoaded', loadFormData);
</script>

<h2 class="text-xl font-semibold mb-4">How would you like to get books for {{ child.name }}?</h2>
<p class="text-gray-600 mb-6 text-sm">Choose the option that works best for your family's reading journey</p>

<form method="post" action="{% url 'portal:onboarding_complete' %}">
    {% csrf_token %}
    <input type="hidden" name="child_id" value="{{ child.id }}">

    <div class="space-y-3 mb-6">
        <!-- Subscription Option -->
        <label class="block cursor-pointer">
            <input type="radio" name="plan_type" value="subscription" required
                   class="sr-only peer">
            <div class="border-2 border-gray-300 rounded-lg p-4 peer-checked:border-primary-600 peer-checked:bg-primary-50 hover:border-primary-400 transition-colors">
                <div class="flex items-start">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <svg class="w-5 h-5 text-primary-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a2 2 0 100 4h2a2 2 0 100-4h-.5a1 1 0 000-2H8a2 2 0 012-2h4a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/>
                            </svg>
                            <h3 class="text-base font-semibold text-gray-900">Monthly Subscription</h3>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">Get curated books delivered monthly. Perfect for regular reading habits.</p>
                        <div class="text-sm">
                            <span class="font-medium text-primary-600">₹499-899/month</span>
                            <span class="text-gray-500 ml-2">• 3-5 books • Return & exchange</span>
                        </div>
                    </div>
                </div>
            </div>
        </label>

        <!-- Purchase Option -->
        <label class="block cursor-pointer">
            <input type="radio" name="plan_type" value="purchase" required
                   class="sr-only peer">
            <div class="border-2 border-gray-300 rounded-lg p-4 peer-checked:border-primary-600 peer-checked:bg-primary-50 hover:border-primary-400 transition-colors">
                <div class="flex items-start">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <svg class="w-5 h-5 text-primary-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3z"/>
                                <path d="M16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
                            </svg>
                            <h3 class="text-base font-semibold text-gray-900">Buy Books</h3>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">Purchase books to build your home library. Keep them forever!</p>
                        <div class="text-sm">
                            <span class="font-medium text-primary-600">₹150-500 per book</span>
                            <span class="text-gray-500 ml-2">• Own forever • No returns</span>
                        </div>
                    </div>
                </div>
            </div>
        </label>

        <!-- Both Option -->
        <label class="block cursor-pointer">
            <input type="radio" name="plan_type" value="both" required
                   class="sr-only peer">
            <div class="border-2 border-gray-300 rounded-lg p-4 peer-checked:border-primary-600 peer-checked:bg-primary-50 hover:border-primary-400 transition-colors">
                <div class="flex items-start">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <svg class="w-5 h-5 text-primary-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2H6zm1 2a1 1 0 000 2h6a1 1 0 100-2H7zm0 4a1 1 0 000 2h6a1 1 0 100-2H7zm0 4a1 1 0 000 2h2a1 1 0 100-2H7zm4 0a1 1 0 100 2h2a1 1 0 100-2h-2z" clip-rule="evenodd"/>
                            </svg>
                            <h3 class="text-base font-semibold text-gray-900">Subscription + Purchase</h3>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">Best of both worlds! Subscribe and buy favorite books.</p>
                        <div class="text-sm">
                            <span class="font-medium text-primary-600">Flexible options</span>
                            <span class="text-gray-500 ml-2">• Monthly books + Buy favorites</span>
                        </div>
                    </div>
                </div>
            </div>
        </label>
    </div>

    <!-- Subscription plans (shown only when subscription or both is selected) -->
    <div id="subscription-plans" class="hidden space-y-3 mb-6">
        <p class="text-sm font-medium text-gray-700 mb-2">Choose your subscription tier:</p>
        {% for plan in subscription_plans %}
        <label class="block cursor-pointer">
            <input type="radio" name="plan_id" value="{{ plan.id }}" 
                   class="sr-only peer"
                   {% if forloop.first %}checked{% endif %}>
            <div class="border-2 border-gray-300 rounded-lg p-3 peer-checked:border-primary-600 peer-checked:bg-primary-50 hover:border-primary-400 transition-colors">
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-semibold text-gray-900">{{ plan.name }}</h4>
                        <p class="text-xs text-gray-600">{{ plan.books_per_month }} books/month • Ages {{ plan.age_group_min }}-{{ plan.age_group_max }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-primary-600">₹{{ plan.price_per_month }}</p>
                        <p class="text-xs text-gray-500">per month</p>
                    </div>
                </div>
            </div>
        </label>
        {% endfor %}
    </div>

    <div class="flex justify-between mt-6">
        <button type="button" 
                onclick="history.back()"
                class="px-4 py-2 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 flex items-center">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back
        </button>
        <button type="submit"
                class="px-4 py-2 text-sm bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg flex items-center">
            <span>Complete Setup</span>
            <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
    </div>
</form>

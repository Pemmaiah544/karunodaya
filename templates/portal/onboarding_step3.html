<h2 class="text-2xl font-semibold mb-6">Choose your subscription plan for {{ child.name }}</h2>

<form method="post" action="{% url 'portal:onboarding_complete' %}">
    {% csrf_token %}
    <input type="hidden" name="child_id" value="{{ child.id }}">

    <div class="space-y-4 mb-6">
        {% for plan in subscription_plans %}
        <label class="block cursor-pointer">
            <input type="radio" name="plan_id" value="{{ plan.id }}" required
                   class="sr-only peer"
                   {% if forloop.first %}checked{% endif %}>
            <div class="border-2 border-gray-300 rounded-lg p-4 peer-checked:border-primary-600 peer-checked:bg-primary-50 hover:border-primary-400 transition-colors">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900">{{ plan.name }}</h3>
                        <p class="text-sm text-gray-600">{{ plan.books_per_month }} books per month</p>
                        <p class="text-xs text-gray-500">Ages {{ plan.age_group_min }}-{{ plan.age_group_max }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-bold text-primary-600">₹{{ plan.price_per_month }}</p>
                        <p class="text-xs text-gray-500">per month</p>
                    </div>
                </div>
            </div>
        </label>
        {% endfor %}
    </div>

    <button type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-4 rounded-lg">
        Complete Setup & Proceed to Payment →
    </button>
</form>

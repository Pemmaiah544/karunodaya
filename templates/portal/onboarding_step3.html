<h2 class="text-2xl font-semibold mb-6">Choose your subscription plan</h2>

<div class="space-y-4 mb-6">
    {% for plan in subscription_plans %}
    <div class="border border-gray-300 rounded-lg p-4 hover:border-primary-600 transition-colors">
        <div class="flex items-center justify-between">
            <div>
                <h3 class="text-lg font-semibold text-gray-900">{{ plan.name }}</h3>
                <p class="text-sm text-gray-600">{{ plan.books_per_month }} books per month</p>
                <p class="text-xs text-gray-500">Ages {{ plan.age_group_min }}-{{ plan.age_group_max }}</p>
            </div>
            <div class="text-right">
                <p class="text-2xl font-bold text-primary-600">₹{{ plan.price_per_month }}</p>
                <p class="text-xs text-gray-500">per month</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<form method="post" action="{% url 'portal:onboarding_complete' %}">
    {% csrf_token %}
    <input type="hidden" name="plan_id" value="{{ subscription_plans.0.id }}">
    <button type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-4 rounded-lg">
        Complete Setup →
    </button>
</form>

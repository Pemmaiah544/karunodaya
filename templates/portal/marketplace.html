{% extends "portal/base.html" %}
{% load static %}

{% block title %}Books - Karunodaya{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-4">
    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Browse Books</h1>
        <p class="text-sm text-gray-500">Discover and purchase books for your children</p>
    </div>

    <!-- Search and Filters Row -->
    <div class="mb-4 space-y-3">
        <!-- Search Bar - Full Width -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" name="q" id="search-input" placeholder="Search books..."
                hx-get="{% url 'portal:marketplace_search' %}" hx-trigger="keyup changed delay:300ms, search"
                hx-target="#book-results" hx-include="[name='q'], [name='difficulty'], [name='grade'], [name='sort']"
                class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none text-sm bg-white shadow-sm">
        </div>

        <!-- Filter and Sort Row -->
        <div class="flex gap-2">
            <!-- Filter Dropdown -->
            <div class="relative flex-1">
                <button type="button" id="filter-button" onclick="toggleFilterDropdown()"
                    class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none text-sm font-medium text-gray-700 flex items-center justify-center gap-2 <svg class="
                    w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filters
                    <span id="filter-count"
                        class="hidden bg-orange-600 text-white text-xs px-1.5 py-0.5 rounded-full ml-1"></span>
                </button>

                <!-- Dropdown Menu - Fixed Position for Mobile -->
                <div id="filter-dropdown"
                    class="hidden absolute left-0 right-0 mt-2 bg-white rounded-xl shadow-lg border border-gray-200 z-50">
                    <div class="p-4 space-y-4">
                        <!-- Difficulty Filter -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-2">Difficulty Level</label>
                            <select name="difficulty" id="difficulty-filter" onchange="applyFilters()"
                                class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none text-sm bg-white">
                                <option value="">All Levels</option>
                                {% for value, label in difficulty_levels %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Grade Filter -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-2">Grade</label>
                            <select name="grade" id="grade-filter" onchange="applyFilters()"
                                class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none text-sm bg-white">
                                <option value="">All Grades</option>
                                {% for value, label in grades %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Clear Filters Button -->
                        <button type="button" onclick="clearFilters()"
                            class="w-full px-3 py-2.5 text-sm text-orange-600 hover:bg-orange-50 rounded-lg font-medium border border-orange-200">
                            Clear Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sort Dropdown -->
            <select name="sort" id="sort-select" hx-get="{% url 'portal:marketplace_search' %}" hx-trigger="change"
                hx-target="#book-results" hx-include="[name='q'], [name='difficulty'], [name='grade'], [name='sort']"
                class="flex-1 px-4 py-2.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none text-sm shadow-sm">
                <option value="title">A-Z</option>
                <option value="-title">Z-A</option>
                <option value="mrp">Price ↑</option>
                <option value="-mrp">Price ↓</option>
                <option value="-created_at">Newest</option>
            </select>
        </div>
    </div>

    <!-- Results Count -->
    <div class="mb-4">
        <p class="text-sm text-gray-600">
            <span id="results-count">{{ books.count }}</span> books found
        </p>
    </div>

    <!-- Book Grid -->
    <div id="book-results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        {% include "portal/components/book_grid.html" %}
    </div>
</div>

<script>
    // Toggle filter dropdown
    function toggleFilterDropdown() {
        const dropdown = document.getElementById('filter-dropdown');
        dropdown.classList.toggle('hidden');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function (event) {
        const dropdown = document.getElementById('filter-dropdown');
        const button = document.getElementById('filter-button');

        if (!dropdown.contains(event.target) && !button.contains(event.target)) {
            dropdown.classList.add('hidden');
        }
    });

    // Apply filters and update count badge
    function applyFilters() {
        const difficulty = document.getElementById('difficulty-filter').value;
        const grade = document.getElementById('grade-filter').value;

        // Update filter count badge
        let count = 0;
        if (difficulty) count++;
        if (grade) count++;

        const badge = document.getElementById('filter-count');
        if (count > 0) {
            badge.textContent = count;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }

        // Trigger HTMX search
        htmx.trigger('#search-input', 'search');
    }

    // Clear all filters
    function clearFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('difficulty-filter').value = '';
        document.getElementById('grade-filter').value = '';
        document.getElementById('sort-select').value = 'title';
        document.getElementById('filter-count').classList.add('hidden');

        // Close dropdown
        document.getElementById('filter-dropdown').classList.add('hidden');

        // Trigger search to reload
        htmx.trigger('#search-input', 'search');
    }
</script>
{% endblock %}
